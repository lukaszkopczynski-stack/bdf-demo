<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Misja: Kod</title>
<style>
  :root{
    --navy:#0B1F5C; --navy-2:#13307F; --navy-deep:#06123A;
    --blue:#2E6FD8; --sky:#7FB6F0; --ice:#EAF2FC;
    --white:#ffffff; --ink:#0E1A3A; --muted:#5B6787;
    --ok:#1E9E6A; --ok-bg:#E7F7EF;
    --err:#D7263D; --err-bg:#FDECEE;
    --gold:#F4C542;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--ice); color:var(--ink);
    min-height:100vh; padding-bottom:calc(110px + env(safe-area-inset-bottom));
  }

  /* ---------- HEADER ---------- */
  header{
    position:relative; overflow:hidden;
    background:radial-gradient(120% 140% at 85% -10%, var(--navy-2) 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color:#fff; padding:calc(18px + env(safe-area-inset-top)) 20px 64px;
  }
  header::after{ /* jasna fala u dołu nagłówka */
    content:""; position:absolute; left:-10%; right:-10%; bottom:-60px; height:110px;
    background:var(--ice); border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .bubbles span{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
  .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .logo-badge{background:#fff;border-radius:12px;padding:9px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;align-items:center}
  .logo-badge img{height:26px;width:auto;display:block}
  .brand .sub{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;opacity:.8;line-height:1.3}
  .wordmark{line-height:1.05}
  .wordmark b{display:block;font-size:22px;letter-spacing:.3px;font-weight:800}
  .wordmark small{display:block;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.75;margin-top:3px}
  .hero{position:relative;z-index:1;margin-top:26px}
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
        background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 10px;border-radius:999px}
  .hero h1{margin:10px 0 6px;font-size:30px;line-height:1.1;font-weight:800}
  .hero p{margin:0;opacity:.85;font-size:15px;line-height:1.45;max-width:34ch}

  /* ---------- PROGRESS ---------- */
  .progress{position:relative;z-index:2;margin:-38px 16px 0;background:#fff;border-radius:16px;
            box-shadow:0 8px 24px rgba(11,31,92,.12);padding:14px 16px;display:flex;align-items:center;gap:12px}
  .dots{display:flex;gap:8px;flex:1}
  .dot{flex:1;height:8px;border-radius:99px;background:#DCE5F3;transition:background .25s}
  .dot.done{background:var(--blue)}
  .dot.bad{background:var(--err)}
  .dot.good{background:var(--ok)}
  .count{font-weight:800;font-size:14px;color:var(--navy);white-space:nowrap}

  main{padding:18px 16px 0;max-width:560px;margin:0 auto}

  /* ---------- CARDS ---------- */
  .card{background:#fff;border-radius:var(--radius);padding:18px 16px 16px;margin-bottom:16px;
        box-shadow:0 2px 0 rgba(11,31,92,.04),0 6px 18px rgba(11,31,92,.06);
        border:2px solid transparent;transition:border-color .2s, background .2s}
  .card.bad{border-color:var(--err);background:linear-gradient(#fff,#fff) padding-box}
  .card.good{border-color:var(--ok)}
  .card.shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .q-num{width:32px;height:32px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;
         display:grid;place-items:center;font-size:15px;flex:none}
  .card.bad .q-num{background:var(--err)} .card.good .q-num{background:var(--ok)}
  .clear{margin-left:auto;white-space:nowrap;flex:none;appearance:none;border:1.5px solid #DCE5F3;background:#fff;color:var(--muted);font:inherit;font-size:12px;font-weight:700;
         padding:6px 10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .clear:active{transform:scale(.95)} .clear[hidden]{display:none}
  .q-type{flex:1;min-width:0;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .q-text{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 14px}
  .note{display:none;margin-top:12px;font-size:14px;font-weight:600;border-radius:12px;padding:10px 12px}
  .card.bad .note{display:block;color:var(--err);background:var(--err-bg)}
  .card.good .note{display:block;color:var(--ok);background:var(--ok-bg)}

  /* ABCD */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{appearance:none;border:2px solid #DCE5F3;background:#F7FAFE;border-radius:14px;padding:14px 12px;
       font:inherit;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px;
       text-align:left;min-height:58px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
  .opt:active{transform:scale(.97)}
  .opt .l{width:28px;height:28px;border-radius:8px;background:#fff;border:2px solid #DCE5F3;display:grid;place-items:center;
          font-size:13px;color:var(--muted);flex:none}
  .opt.sel{border-color:var(--blue);background:#EAF2FF}
  .opt.sel .l{background:var(--blue);border-color:var(--blue);color:#fff}

  /* KAFELKI */
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .slot{position:relative;min-height:60px;border-radius:14px;border:2px dashed #B9C8E2;background:#F7FAFE;
        display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--ink);cursor:pointer}
  .slot::before{content:attr(data-n);position:absolute;top:4px;left:7px;font-size:10px;color:var(--muted);font-weight:700}
  .slot.filled{border-style:solid;border-color:var(--blue);background:#EAF2FF;animation:pop .18s}
  @keyframes pop{from{transform:scale(.85)}to{transform:none}}
  .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
  .tile{appearance:none;border:0;font:inherit;font-weight:800;font-size:18px;color:#fff;cursor:pointer;
        background:linear-gradient(160deg,var(--blue),var(--navy-2));border-radius:14px;min-width:64px;padding:16px 14px;
        box-shadow:0 4px 0 var(--navy-deep);transition:transform .08s}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-deep)}
  .tiles-hint{font-size:13px;color:var(--muted);margin:10px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .reset{appearance:none;border:0;background:none;color:var(--blue);font:inherit;font-weight:700;font-size:13px;padding:6px 0;cursor:pointer}

  /* ---------- BOTTOM BAR ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
       background:linear-gradient(to top, var(--ice) 70%, rgba(234,242,252,0))}
  .msg{max-width:560px;margin:0 auto 10px;font-size:14px;font-weight:600;border-radius:12px;padding:10px 12px;display:none}
  .msg.show{display:block;background:var(--err);color:#fff;animation:pop .2s}
  .check{display:block;width:100%;max-width:560px;margin:0 auto;appearance:none;border:0;cursor:pointer;
         font:inherit;font-size:19px;font-weight:900;letter-spacing:2px;color:#fff;padding:18px;border-radius:16px;
         background:linear-gradient(160deg,var(--navy-2),var(--navy));box-shadow:0 6px 0 var(--navy-deep),0 10px 24px rgba(11,31,92,.3);
         transition:transform .08s}
  .check:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy-deep)}

  /* ---------- SUKCES ---------- */
  .win{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;color:#fff;padding:24px;
       background:radial-gradient(90% 70% at 50% 40%, var(--navy-2) 0%, var(--navy) 50%, var(--navy-deep) 100%)}
  .win.show{display:flex;animation:fade .35s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win .pill{margin-bottom:14px}
  .win h2{margin:0 0 6px;font-size:26px;font-weight:800}
  .win p{margin:0;opacity:.85}
  .digit-wrap{position:relative;margin:28px 0;width:220px;height:220px;display:grid;place-items:center}
  .digit-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;
       background:radial-gradient(circle, rgba(127,182,240,.45), rgba(127,182,240,0) 70%);animation:pulse 2.2s infinite}
  .ring{position:absolute;inset:14px;border-radius:50%;border:3px solid rgba(255,255,255,.85);
        box-shadow:0 0 30px rgba(127,182,240,.7), inset 0 0 30px rgba(127,182,240,.35)}
  .digit{position:relative;font-size:150px;font-weight:900;line-height:1;
         text-shadow:0 0 30px rgba(127,182,240,.9);animation:reveal .9s cubic-bezier(.2,1.4,.4,1) both .2s}
  @keyframes reveal{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes pulse{50%{transform:scale(1.12);opacity:.6}}
  .win .back{margin-top:26px;appearance:none;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;
             font:inherit;font-weight:700;padding:12px 22px;border-radius:999px;cursor:pointer}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:21}

  footer{text-align:center;font-size:12px;color:var(--muted);padding:6px 0 20px}
</style>
</head>
<body>

<header>
  <div class="bubbles" aria-hidden="true">
    <span style="width:180px;height:180px;right:-50px;top:-40px"></span>
    <span style="width:90px;height:90px;right:90px;top:70px"></span>
    <span style="width:40px;height:40px;left:62%;top:20px"></span>
  </div>
  <div class="brand">
    <!-- LOGO: plik logo.svg (lub logo.png) w tym samym folderze -->
    <div class="logo-badge" id="logoBadge"><img src="logo.svg" alt="Beiersdorf"
      onerror="if(!this.dataset.png){this.dataset.png=1;this.src='logo.png'}else{document.getElementById('logoBadge').remove();document.getElementById('wm').hidden=false}"></div>
    <div class="sub" id="sub">Manufacturing<br>Poznań</div>
    <div class="wordmark" id="wm" hidden><b>Beiersdorf</b><small>Manufacturing Poznań</small></div>
  </div>
  <div class="hero">
    <span class="pill" id="station"></span>
    <h1 id="title"></h1>
    <p id="intro"></p>
  </div>
</header>

<div class="progress">
  <div class="dots" id="dots"></div>
  <div class="count" id="count">0 / 5</div>
</div>

<main id="questions"></main>
<footer>Beiersdorf Manufacturing Poznań sp. z o.o.</footer>

<div class="bar">
  <div class="msg" id="msg" role="alert"></div>
  <button class="check" id="check">SPRAWDŹ</button>
</div>

<div class="win" id="win" aria-live="polite">
  <span class="pill">Kod odblokowany</span>
  <h2>Brawo, zespole!</h2>
  <p>Wasza cyfra kodu to:</p>
  <div class="digit-wrap"><div class="ring"></div><div class="digit" id="digit"></div></div>
  <p id="outro"></p>
  <button class="back" id="back">Wróć do pytań</button>
</div>
<canvas id="confetti"></canvas>

<script>
/* =====================================================================
   KONFIGURACJA – tu zmieniasz treść zadania
   type: "abcd"  -> options: 4 odpowiedzi, answer: indeks poprawnej (0=A, 1=B, 2=C, 3=D)
   type: "order" -> tiles: kafelki W POPRAWNEJ KOLEJNOŚCI (aplikacja sama je przetasuje)
   ===================================================================== */
const CONFIG = {
  station: "Zadanie 1 · Stacja Kod",
  title: "Złam kod!",
  intro: "Odpowiedzcie poprawnie na 5 pytań i naciśnijcie SPRAWDŹ, aby poznać cyfrę kodu.",
  digit: 2,
  outro: "Zapiszcie ją – to element Waszego kodu!",
  questions: [
    { type:"abcd",  text:"Ile to jest 2 + 2?",  options:["3","4","5","22"], answer:1 },
    { type:"abcd",  text:"Ile to jest 3 × 3?",  options:["6","33","9","12"], answer:2 },
    { type:"order", text:"Ułóżcie liczby od najmniejszej do największej.", tiles:["2","4","7","9"] },
    { type:"abcd",  text:"Ile to jest 10 − 7?", options:["3","17","7","4"], answer:0 },
    { type:"order", text:"Ułóżcie działania od najmniejszego do największego wyniku.", tiles:["9 − 8","2 × 3","4 + 4","5 + 5"] }
  ]
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const STORE_KEY = "bdf-quiz-v1";
const Q = CONFIG.questions;
const LETTERS = ["A","B","C","D"];

$("#station").textContent = CONFIG.station;
$("#title").textContent = CONFIG.title;
$("#intro").textContent = CONFIG.intro;
$("#outro").textContent = CONFIG.outro;

// stan: abcd -> indeks lub null; order -> tablica wybranych kafelków (indeksy w tablicy tiles)
let state = Q.map(q => q.type === "abcd" ? null : []);
// stała (per urządzenie) kolejność potasowanych kafelków
let shuffles = Q.map(q => q.type === "order" ? shuffle(q.tiles.map((_, i) => i)) : null);

// dodaj ?reset do adresu, aby wyczyścić zapisane odpowiedzi (np. przed pokazem)
if (/[?&]reset/.test(location.search)) {
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  try{ history.replaceState(null, "", location.pathname); }catch(e){} // odświeżenie strony nie skasuje już odpowiedzi
}
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && saved.state && saved.state.length === Q.length) { state = saved.state; shuffles = saved.shuffles; }
} catch (e) {}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({state, shuffles})); }catch(e){} }

function shuffle(a){
  do { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
  while (a.length > 1 && a.every((v,i)=>v===i)); // nigdy nie startuj od poprawnej kolejności
  return a;
}

function render(){
  const main = $("#questions");
  main.innerHTML = "";
  Q.forEach((q, qi) => {
    const card = document.createElement("section");
    card.className = "card"; card.id = "q"+qi;
    card.innerHTML = `
      <div class="q-head"><div class="q-num">${qi+1}</div>
        <div class="q-type">${q.type==="abcd" ? "Wybierz jedną odpowiedź" : "Ułóż we właściwej kolejności"}</div>
        <button class="clear" aria-label="Wyczyść odpowiedź na pytanie ${qi+1}">↺ Wyczyść</button></div>
      <p class="q-text"></p><div class="body"></div><div class="note"></div>`;
    card.querySelector(".q-text").textContent = q.text;
    const body = card.querySelector(".body");
    const clear = card.querySelector(".clear");
    clear.hidden = !(q.type === "abcd" ? state[qi] !== null : state[qi].length);
    clear.onclick = () => { state[qi] = q.type === "abcd" ? null : []; changed(qi); };

    if (q.type === "abcd") {
      const opts = document.createElement("div"); opts.className = "opts";
      q.options.forEach((o, oi) => {
        const b = document.createElement("button");
        b.className = "opt" + (state[qi]===oi ? " sel" : "");
        b.innerHTML = `<span class="l">${LETTERS[oi]}</span><span></span>`;
        b.lastChild.textContent = o;
        b.onclick = () => { state[qi] = oi; changed(qi); };
        opts.appendChild(b);
      });
      body.appendChild(opts);
    } else {
      const slots = document.createElement("div"); slots.className = "slots";
      for (let s=0; s<q.tiles.length; s++){
        const slot = document.createElement("div");
        const picked = state[qi][s];
        slot.className = "slot" + (picked!==undefined ? " filled" : "");
        slot.dataset.n = s+1;
        if (picked!==undefined){
          slot.textContent = q.tiles[picked];
          slot.onclick = () => { state[qi].splice(s,1); changed(qi); };
        }
        slots.appendChild(slot);
      }
      const pool = document.createElement("div"); pool.className = "pool";
      shuffles[qi].filter(ti => !state[qi].includes(ti)).forEach(ti => {
        const t = document.createElement("button"); t.className = "tile"; t.textContent = q.tiles[ti];
        t.onclick = () => { state[qi].push(ti); changed(qi); };
        pool.appendChild(t);
      });
      const hint = document.createElement("div"); hint.className = "tiles-hint";
      hint.innerHTML = `<span>Stuknij kafelek, aby go ułożyć. Stuknij pole, aby go zdjąć.</span>`;
      body.append(slots, pool, hint);
    }
    main.appendChild(card);
  });
  updateProgress();
}

function answered(qi){ const q=Q[qi]; return q.type==="abcd" ? state[qi]!==null : state[qi].length===q.tiles.length; }
function correct(qi){ const q=Q[qi]; return q.type==="abcd" ? state[qi]===q.answer : answered(qi) && state[qi].every((v,i)=>v===i); }

let checked = {}; // qi -> "bad"/"good" po ostatnim sprawdzeniu
function changed(qi){
  delete checked[qi];           // po zmianie odpowiedzi zdejmij oznaczenie
  save(); render(); applyMarks();
  if (!Object.values(checked).includes("bad")) $("#msg").classList.remove("show");
}
function applyMarks(){
  Object.entries(checked).forEach(([qi, st]) => {
    const c = document.getElementById("q"+qi); c.classList.add(st);
    c.querySelector(".note").textContent = st==="bad"
      ? (answered(qi) ? "✗ Ta odpowiedź jest błędna – popraw ją, aby poznać cyfrę." : "✗ Brakuje odpowiedzi – uzupełnij to pytanie.")
      : "✓ Dobrze!";
  });
  updateProgress();
}
function updateProgress(){
  const dots = $("#dots"); dots.innerHTML = "";
  let n = 0;
  Q.forEach((_, qi) => {
    const d = document.createElement("div");
    d.className = "dot " + (checked[qi] || (answered(qi) ? "done" : ""));
    if (answered(qi)) n++;
    dots.appendChild(d);
  });
  $("#count").textContent = `${n} / ${Q.length}`;
}

$("#check").onclick = () => {
  checked = {};
  const bad = [];
  Q.forEach((_, qi) => { if (correct(qi)) checked[qi]="good"; else { checked[qi]="bad"; bad.push(qi); } });
  render(); applyMarks();
  if (bad.length === 0) { win(); return; }
  const m = $("#msg");
  m.textContent = bad.length===1
    ? `Pytanie ${bad[0]+1} wymaga poprawy. Popraw je, aby poznać cyfrę!`
    : `Pytania ${bad.map(b=>b+1).join(", ")} wymagają poprawy. Popraw je, aby poznać cyfrę!`;
  m.classList.remove("show"); void m.offsetWidth; m.classList.add("show");
  bad.forEach(b => document.getElementById("q"+b).classList.add("shake"));
  document.getElementById("q"+bad[0]).scrollIntoView({behavior:"smooth", block:"center"});
  if (navigator.vibrate) navigator.vibrate([80,60,80]);
};

function win(){
  $("#msg").classList.remove("show");
  $("#digit").textContent = CONFIG.digit;
  const w = $("#win"); w.classList.remove("show"); void w.offsetWidth; w.classList.add("show");
  if (navigator.vibrate) navigator.vibrate(200);
  confetti();
}
$("#back").onclick = () => $("#win").classList.remove("show");

function confetti(){
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const colors = ["#ffffff","#7FB6F0","#2E6FD8","#F4C542","#BFD9F7"];
  const ps = Array.from({length:160}, () => ({
    x: innerWidth/2, y: innerHeight*0.42, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4,
    s: 5+Math.random()*7, r: Math.random()*6, vr:(Math.random()-.5)*.4, c: colors[Math.random()*colors.length|0]
  }));
  let t = 0;
  (function frame(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if (++t < 200) requestAnimationFrame(frame); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

render();
</script>
</body>
</html>
